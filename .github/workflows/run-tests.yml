name: Run MATLAB Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # Pinned deliberately. Without a release, this action installs the
          # latest, which moved to R2026a and broke the suite: MATLAB aborts
          # with "Intel oneMKL FATAL ERROR: Cannot load .../glnxa64/mkl.so"
          # (exit status 255) at the first test to touch a BLAS routine.
          # Commit 0bccce1 passed on 2026-06-03 and fails today unchanged, so
          # the regression is in the runner image / MATLAB release, not here.
          # Same class of problem as matlab-actions/setup-matlab#154, where
          # newer releases crash because base dependencies are not installed.
          # Revisit once that is fixed upstream.
          release: R2025b
          products: >
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Deep_Learning_Toolbox

      # TEMPORARY diagnostic (see PR #139). ldd showed mkl.so needs libiomp5.so
      # and cannot find it. Determine whether MATLAB ships it at all, or ships
      # it somewhere the loader is not looking. Remove once the fix is in.
      - name: Diagnose MKL load failure
        continue-on-error: true
        run: |
          ROOT=$(ls -d /opt/hostedtoolcache/MATLAB/*/x64 2>/dev/null | head -1)
          echo "matlabroot = $ROOT"
          echo "--- libiomp5 anywhere under matlabroot ---"
          find "$ROOT" -name 'libiomp5*' 2>/dev/null || true
          echo "(end of find)"
          echo "--- contents of bin/glnxa64 matching iomp/omp/mkl ---"
          ls -la "$ROOT/bin/glnxa64" 2>/dev/null | grep -iE 'iomp|omp|mkl' || echo "(no matches)"
          echo "--- dlopen with LD_LIBRARY_PATH=bin/glnxa64 ---"
          LD_LIBRARY_PATH="$ROOT/bin/glnxa64:$LD_LIBRARY_PATH" python3 - "$ROOT/bin/glnxa64/mkl.so" <<'PY'
          import ctypes, sys
          try:
              ctypes.CDLL(sys.argv[1]); print("dlopen OK with LD_LIBRARY_PATH")
          except OSError as e:
              print("dlopen STILL FAILED:", e)
          PY
          echo "--- system openmp packages available ---"
          apt-cache policy libomp5-18 libomp-dev intel-oneapi-runtime-openmp 2>/dev/null | head -20 || true
          ls -la /usr/lib/x86_64-linux-gnu/ | grep -iE 'libomp|libiomp' || echo "(no system openmp lib)"

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir);
            vlt_Init;
            suite = matlab.unittest.TestSuite.fromPackage('vlt.unittest', 'IncludingSubpackages', true);
            runner = matlab.unittest.TestRunner.withTextOutput;
            results = runner.run(suite);
            disp(table(results));
            assert(all(~[results.Failed]), 'Some tests failed.');
