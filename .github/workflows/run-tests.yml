name: Run MATLAB Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: >
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Deep_Learning_Toolbox

      # MATLAB aborts at the first BLAS call with
      #   Intel oneMKL FATAL ERROR: Cannot load .../bin/glnxa64/mkl.so
      # (exit status 255). That reads as a test failure but is a loader
      # problem: ldd on mkl.so reports "libiomp5.so => not found". MATLAB does
      # ship that library, at $matlabroot/sys/os/glnxa64/libiomp5.so, but on
      # the current runner image mkl.so no longer resolves it.
      #
      # Exporting LD_LIBRARY_PATH does not help -- MATLAB's launcher computes
      # its own -- so expose the library through the system loader, which the
      # launcher cannot override. See PR #139.
      - name: Expose MATLAB's OpenMP runtime to the system loader
        run: |
          ROOT=$(ls -d /opt/hostedtoolcache/MATLAB/*/x64 | head -1)
          SRC="$ROOT/sys/os/glnxa64/libiomp5.so"
          test -f "$SRC" || { echo "::error::libiomp5.so not found at $SRC"; exit 1; }
          sudo ln -sf "$SRC" /usr/lib/x86_64-linux-gnu/libiomp5.so
          sudo ldconfig
          echo "--- verifying mkl.so now resolves ---"
          ldd "$ROOT/bin/glnxa64/mkl.so" | grep -i iomp5
          if ldd "$ROOT/bin/glnxa64/mkl.so" | grep -q "not found"; then
            echo "::error::mkl.so still has unresolved dependencies"
            ldd "$ROOT/bin/glnxa64/mkl.so" | grep "not found"
            exit 1
          fi
          echo "mkl.so dependencies all resolve"

      # TEMPORARY probes (PR #139). A-F cleared vlt_Init, testCdfTukey alone,
      # the preceding classes followed by a generic BLAS call, full suite
      # construction, and the JVM. So it is the COMBINATION: those classes
      # followed by testCdfTukey in one process. Bisect which one matters.
      # test_simple_batch is the prime suspect -- it evaluates jobs, and a
      # fork() leaves an OpenMP runtime in an undefined state, which is a
      # classic source of "Intel oneMKL FATAL ERROR: Cannot load".
      - name: 'Probe G: batch then testCdfTukey'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir); vlt_Init;
            fprintf(1,'G1 batch\n');
            r = runtests('vlt.unittest.batch.test_simple_batch');
            fprintf(1,'G2 now testCdfTukey\n');
            r = runtests('vlt.unittest.stats.testCdfTukey');
            fprintf(1,'G3 PROBE G PASSED\n');

      - name: 'Probe H: colorspace+docs then testCdfTukey'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir); vlt_Init;
            fprintf(1,'H1 colorspace+docs\n');
            r = runtests({'vlt.unittest.colorspace.TestColorspace', ...
                          'vlt.unittest.docs.test_mkdocsnavtext'});
            fprintf(1,'H2 now testCdfTukey\n');
            r = runtests('vlt.unittest.stats.testCdfTukey');
            fprintf(1,'H3 PROBE H PASSED\n');

      - name: 'Probe I: batch then plain BLAS and cdfTukey directly'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir); vlt_Init;
            r = runtests('vlt.unittest.batch.test_simple_batch');
            fprintf(1,'I1 batch done\n');
            C = inv(rand(50)); fprintf(1,'I2 inv ok\n');
            y = vlt.stats.cdfTukey(3.879,3,10); fprintf(1,'I3 cdfTukey ok = %g\n', y);
            fprintf(1,'I4 PROBE I PASSED\n');

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir);
            vlt_Init;
            suite = matlab.unittest.TestSuite.fromPackage('vlt.unittest', 'IncludingSubpackages', true);
            runner = matlab.unittest.TestRunner.withTextOutput;
            results = runner.run(suite);
            disp(table(results));
            assert(all(~[results.Failed]), 'Some tests failed.');
