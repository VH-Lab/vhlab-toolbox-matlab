name: Run MATLAB Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: >
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Deep_Learning_Toolbox

      # MATLAB aborts at the first BLAS call with
      #   Intel oneMKL FATAL ERROR: Cannot load .../bin/glnxa64/mkl.so
      # (exit status 255). That reads as a test failure but is a loader
      # problem: ldd on mkl.so reports "libiomp5.so => not found". MATLAB does
      # ship that library, at $matlabroot/sys/os/glnxa64/libiomp5.so, but on
      # the current runner image mkl.so no longer resolves it.
      #
      # Exporting LD_LIBRARY_PATH does not help -- MATLAB's launcher computes
      # its own -- so expose the library through the system loader, which the
      # launcher cannot override. See PR #139.
      - name: Expose MATLAB's OpenMP runtime to the system loader
        run: |
          ROOT=$(ls -d /opt/hostedtoolcache/MATLAB/*/x64 | head -1)
          SRC="$ROOT/sys/os/glnxa64/libiomp5.so"
          test -f "$SRC" || { echo "::error::libiomp5.so not found at $SRC"; exit 1; }
          sudo ln -sf "$SRC" /usr/lib/x86_64-linux-gnu/libiomp5.so
          sudo ldconfig
          echo "--- verifying mkl.so now resolves ---"
          ldd "$ROOT/bin/glnxa64/mkl.so" | grep -i iomp5
          if ldd "$ROOT/bin/glnxa64/mkl.so" | grep -q "not found"; then
            echo "::error::mkl.so still has unresolved dependencies"
            ldd "$ROOT/bin/glnxa64/mkl.so" | grep "not found"
            exit 1
          fi
          echo "mkl.so dependencies all resolve"

      # TEMPORARY probes (PR #139). Probes A-I cleared every isolated cause.
      # Two new leads: (1) +vlt/+batch/simple_batch.m:48 runs
      # evalin('base','clear; clear mex;') during the first test class of the
      # suite, which manipulates process state mid-run; (2) the failure may be
      # purely order-dependent. Probe K is the decisive test -- same full suite,
      # stats moved to the front.
      - name: 'Probe J: the whole stats package, alone'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir); vlt_Init;
            fprintf(1,'J1 running vlt.unittest.stats alone\n');
            s = matlab.unittest.TestSuite.fromPackage('vlt.unittest.stats','IncludingSubpackages',true);
            fprintf(1,'J2 %d stats tests\n', numel(s));
            r = matlab.unittest.TestRunner.withTextOutput.run(s);
            fprintf(1,'J3 PROBE J PASSED: %d passed, %d failed\n', nnz([r.Passed]), nnz([r.Failed]));

      - name: 'Probe K: full suite, stats reordered FIRST'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir); vlt_Init;
            suite = matlab.unittest.TestSuite.fromPackage('vlt.unittest','IncludingSubpackages',true);
            names = {suite.Name};
            isStats = startsWith(names,'vlt.unittest.stats');
            fprintf(1,'K1 %d total, %d stats moved to front\n', numel(suite), nnz(isStats));
            reordered = [suite(isStats), suite(~isStats)];
            r = matlab.unittest.TestRunner.withTextOutput.run(reordered);
            fprintf(1,'K2 PROBE K PASSED: %d passed, %d failed\n', nnz([r.Passed]), nnz([r.Failed]));

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir);
            vlt_Init;
            suite = matlab.unittest.TestSuite.fromPackage('vlt.unittest', 'IncludingSubpackages', true);
            runner = matlab.unittest.TestRunner.withTextOutput;
            results = runner.run(suite);
            disp(table(results));
            assert(all(~[results.Failed]), 'Some tests failed.');
