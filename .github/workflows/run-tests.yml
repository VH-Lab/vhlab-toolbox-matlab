name: Run MATLAB Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: >
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Deep_Learning_Toolbox

      # MATLAB ships its Intel OpenMP runtime in sys/os/glnxa64, but mkl.so
      # lives in bin/glnxa64 and, on the current runner image, cannot find it.
      # MATLAB then aborts at the first BLAS call with
      #   Intel oneMKL FATAL ERROR: Cannot load .../glnxa64/mkl.so
      # (exit status 255), which reads as a test failure but is a loader
      # problem. Confirmed by ldd: "libiomp5.so => not found", with the library
      # present at $matlabroot/sys/os/glnxa64/libiomp5.so. See PR #139.
      - name: Put MATLAB's OpenMP runtime on the loader path
        run: |
          ROOT=$(ls -d /opt/hostedtoolcache/MATLAB/*/x64 | head -1)
          test -f "$ROOT/sys/os/glnxa64/libiomp5.so" || {
            echo "::error::libiomp5.so not found under $ROOT/sys/os/glnxa64"; exit 1; }
          echo "LD_LIBRARY_PATH=$ROOT/sys/os/glnxa64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir);
            vlt_Init;
            suite = matlab.unittest.TestSuite.fromPackage('vlt.unittest', 'IncludingSubpackages', true);
            runner = matlab.unittest.TestRunner.withTextOutput;
            results = runner.run(suite);
            disp(table(results));
            assert(all(~[results.Failed]), 'Some tests failed.');
