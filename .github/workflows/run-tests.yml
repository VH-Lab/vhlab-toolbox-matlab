name: Run MATLAB Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # Pinned deliberately. Without a release, this action installs the
          # latest, which moved to R2026a and broke the suite: MATLAB aborts
          # with "Intel oneMKL FATAL ERROR: Cannot load .../glnxa64/mkl.so"
          # (exit status 255) at the first test to touch a BLAS routine.
          # Commit 0bccce1 passed on 2026-06-03 and fails today unchanged, so
          # the regression is in the runner image / MATLAB release, not here.
          # Same class of problem as matlab-actions/setup-matlab#154, where
          # newer releases crash because base dependencies are not installed.
          # Revisit once that is fixed upstream.
          release: R2025b
          products: >
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Deep_Learning_Toolbox

      # TEMPORARY diagnostic (see PR #139). Pinning the MATLAB release did not
      # help: R2026a and R2025b both fail to load mkl.so, so the change is in
      # the runner image, not MATLAB. This prints the unresolved dependencies
      # so the missing package can be named instead of guessed at. Remove once
      # the real fix is in.
      - name: Diagnose MKL load failure
        continue-on-error: true
        run: |
          set -x
          cat /etc/os-release | head -2
          MKL=$(ls /opt/hostedtoolcache/MATLAB/*/x64/bin/glnxa64/mkl.so 2>/dev/null | head -1)
          echo "mkl.so = $MKL"
          ls -la "$MKL" || true
          echo "--- ldd ---"
          ldd "$MKL" || true
          echo "--- unresolved ---"
          ldd "$MKL" 2>&1 | grep -i "not found" || echo "(none reported by ldd)"
          echo "--- dlopen attempt ---"
          python3 - "$MKL" <<'PY'
          import ctypes, sys
          try:
              ctypes.CDLL(sys.argv[1])
              print("dlopen OK")
          except OSError as e:
              print("dlopen FAILED:", e)
          PY

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir);
            vlt_Init;
            suite = matlab.unittest.TestSuite.fromPackage('vlt.unittest', 'IncludingSubpackages', true);
            runner = matlab.unittest.TestRunner.withTextOutput;
            results = runner.run(suite);
            disp(table(results));
            assert(all(~[results.Failed]), 'Some tests failed.');
