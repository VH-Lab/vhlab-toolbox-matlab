name: Run MATLAB Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: >
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Deep_Learning_Toolbox

      # MATLAB aborts at the first BLAS call with
      #   Intel oneMKL FATAL ERROR: Cannot load .../bin/glnxa64/mkl.so
      # (exit status 255). That reads as a test failure but is a loader
      # problem: ldd on mkl.so reports "libiomp5.so => not found". MATLAB does
      # ship that library, at $matlabroot/sys/os/glnxa64/libiomp5.so, but on
      # the current runner image mkl.so no longer resolves it.
      #
      # Exporting LD_LIBRARY_PATH does not help -- MATLAB's launcher computes
      # its own -- so expose the library through the system loader, which the
      # launcher cannot override. See PR #139.
      - name: Expose MATLAB's OpenMP runtime to the system loader
        run: |
          ROOT=$(ls -d /opt/hostedtoolcache/MATLAB/*/x64 | head -1)
          SRC="$ROOT/sys/os/glnxa64/libiomp5.so"
          test -f "$SRC" || { echo "::error::libiomp5.so not found at $SRC"; exit 1; }
          sudo ln -sf "$SRC" /usr/lib/x86_64-linux-gnu/libiomp5.so
          sudo ldconfig
          echo "--- verifying mkl.so now resolves ---"
          ldd "$ROOT/bin/glnxa64/mkl.so" | grep -i iomp5
          if ldd "$ROOT/bin/glnxa64/mkl.so" | grep -q "not found"; then
            echo "::error::mkl.so still has unresolved dependencies"
            ldd "$ROOT/bin/glnxa64/mkl.so" | grep "not found"
            exit 1
          fi
          echo "mkl.so dependencies all resolve"

      # TEMPORARY probes (PR #139). Probes A-C cleared vlt_Init, testCdfTukey
      # in isolation, and the three classes that precede it. Only the FULL
      # suite fails. The full suite differs by constructing over every package,
      # which is when the org.json.JSONObject import in
      # +unittest/+deprecated/+data/test_prettyjson.m is attempted -- and that
      # starts the JVM. A JVM bringing in its own OpenMP runtime is a classic
      # cause of "Intel oneMKL FATAL ERROR: Cannot load".
      - name: 'Probe D: build full suite, then BLAS'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir); vlt_Init;
            fprintf(1,'D1 building full suite\n');
            suite = matlab.unittest.TestSuite.fromPackage('vlt.unittest','IncludingSubpackages',true);
            fprintf(1,'D2 suite built, %d tests\n', numel(suite));
            C = inv(rand(50));
            fprintf(1,'D3 PROBE D PASSED - BLAS survives suite construction\n');

      - name: 'Probe E: start the JVM, then BLAS'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: |
            fprintf(1,'E1 jvm initially: %d\n', usejava('jvm'));
            s = javaObject('java.lang.String','hello');
            fprintf(1,'E2 JVM started\n');
            C = inv(rand(50));
            fprintf(1,'E3 PROBE E PASSED - BLAS survives the JVM\n');

      - name: 'Probe F: BLAS first, then JVM, then BLAS again'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: |
            C = inv(rand(50)); fprintf(1,'F1 BLAS before JVM ok\n');
            s = javaObject('java.lang.String','hello'); fprintf(1,'F2 JVM started\n');
            C = inv(rand(50)); fprintf(1,'F3 PROBE F PASSED\n');

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            userpath(tempdir);
            vlt_Init;
            suite = matlab.unittest.TestSuite.fromPackage('vlt.unittest', 'IncludingSubpackages', true);
            runner = matlab.unittest.TestRunner.withTextOutput;
            results = runner.run(suite);
            disp(table(results));
            assert(all(~[results.Failed]), 'Some tests failed.');
